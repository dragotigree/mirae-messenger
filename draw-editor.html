<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>그림 그리기</title>
<style>
  :root{
    --bg:#f9fafb; --panel:#ffffff; --line:#e5e7eb; --ink:#0f172a; --muted:#64748b;
    --accent:#2563eb; --accent-soft:#eff6ff; --shadow:0 8px 28px rgba(15,23,42,.13);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:'Pretendard','Malgun Gothic','Segoe UI',sans-serif;color:var(--ink);
    user-select:none;-webkit-user-select:none}
  /* 캔버스: 은은한 점 격자 — tldraw처럼 넓은 작업면 느낌을 준다 */
  #board{position:absolute;inset:0;
    background-color:var(--bg);
    background-image:radial-gradient(circle, #dfe3e8 1px, transparent 1px);
    background-size:22px 22px;
    touch-action:none;cursor:crosshair;display:block}

  .float{position:absolute;background:var(--panel);border:1px solid var(--line);
    border-radius:14px;box-shadow:var(--shadow);display:flex;align-items:center;gap:2px;padding:5px}

  /* 하단 중앙 도구 막대 */
  #tools{left:50%;bottom:18px;transform:translateX(-50%);z-index:10}
  .tool{width:38px;height:38px;border:none;background:transparent;border-radius:10px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;color:var(--muted);
    transition:background .12s,color .12s,transform .08s}
  .tool:hover{background:#f1f5f9;color:var(--ink)}
  .tool.on{background:var(--accent-soft);color:var(--accent)}
  .tool:active{transform:scale(.93)}
  .tool svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;
    stroke-linecap:round;stroke-linejoin:round}
  .divider{width:1px;height:22px;background:var(--line);margin:0 4px;flex-shrink:0}

  /* 좌측 상단: 색/굵기 */
  #style{left:18px;top:18px;flex-direction:column;align-items:stretch;gap:9px;padding:11px;z-index:10}
  .row{display:flex;align-items:center;gap:7px}
  .swatch{width:22px;height:22px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;
    box-shadow:inset 0 0 0 1px rgba(15,23,42,.12);transition:transform .1s}
  .swatch:hover{transform:scale(1.14)}
  .swatch.on{border-color:var(--accent);transform:scale(1.1)}
  .sizes{display:flex;align-items:center;gap:6px}
  .size{width:26px;height:26px;border:none;background:transparent;border-radius:8px;cursor:pointer;
    display:flex;align-items:center;justify-content:center}
  .size:hover{background:#f1f5f9}
  .size.on{background:var(--accent-soft)}
  .size i{display:block;border-radius:50%;background:var(--muted)}
  .size.on i{background:var(--accent)}
  .label{font-size:10.5px;color:var(--muted);font-weight:700;letter-spacing:.02em}

  /* 우측 상단: 실행취소/저장 */
  #actions{right:18px;top:18px;gap:6px;z-index:10}
  .btn{height:34px;padding:0 13px;border:1px solid var(--line);background:var(--panel);
    border-radius:10px;font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer;
    font-family:inherit;display:flex;align-items:center;gap:5px;transition:background .12s,color .12s}
  .btn:hover:not(:disabled){background:#f1f5f9;color:var(--ink)}
  .btn:disabled{opacity:.4;cursor:default}
  .btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;
    stroke-linecap:round;stroke-linejoin:round}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn-primary:hover:not(:disabled){background:#1d4ed8;color:#fff}
  .btn-danger:hover:not(:disabled){background:#fee2e2;color:#b91c1c}

  /* 안내문 — 아무것도 안 그렸을 때만 */
  #hint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;
    color:#cbd5e1;font-size:15px;font-weight:700;pointer-events:none;z-index:1;line-height:1.7}
  #hint.hide{display:none}

  /* 텍스트 입력 */
  #textbox{position:absolute;z-index:20;display:none;border:2px solid var(--accent);
    border-radius:8px;padding:4px 7px;background:#fff;font-family:inherit;outline:none;
    min-width:120px;box-shadow:var(--shadow)}
</style>
</head>
<body>
  <canvas id="board"></canvas>
  <div id="hint">여기에 그려 보세요<br><span style="font-size:12.5px;font-weight:600">다 그리면 오른쪽 위 「이미지로 넣기」</span></div>

  <div class="float" id="style">
    <span class="label">색상</span>
    <div class="row" id="colors"></div>
    <span class="label">굵기</span>
    <div class="sizes" id="sizes"></div>
    <span class="label">채우기</span>
    <button class="btn" id="fill-toggle" style="height:28px;padding:0 10px;font-size:11.5px;">안 채움</button>
  </div>

  <div class="float" id="actions">
    <button class="btn" id="undo" title="되돌리기 (Ctrl+Z)">
      <svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg>되돌리기
    </button>
    <button class="btn" id="redo" title="다시하기 (Ctrl+Shift+Z)">
      <svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg>다시
    </button>
    <button class="btn btn-danger" id="clear" title="전부 지우기">전체 지우기</button>
    <button class="btn" id="cancel">취소</button>
    <button class="btn btn-primary" id="save">이미지로 넣기</button>
  </div>

  <div class="float" id="tools"></div>
  <input id="textbox" type="text" placeholder="내용 입력 후 Enter">

<script src="lib/draw-app.js"></script>
<script>
(function () {
  'use strict';

  // ── 도구 정의 ─────────────────────────────────────────────
  var TOOLS = [
    { id:'select', name:'선택·이동 (그린 것을 끌어 옮기고, Delete로 지웁니다)', svg:'<path d="m4 3 6.5 17 2.5-7 7-2.5z"/>' },
    { id:'pen',    name:'펜',        svg:'<path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.586 7.586"/><circle cx="11" cy="11" r="2"/>' },
    { id:'marker', name:'형광펜',    svg:'<path d="M9 11l-6 6v3h3l6-6"/><path d="M13 7l4 4"/><path d="M16 3l5 5-8 8-5-5z"/>' },
    { id:'eraser', name:'지우개',    svg:'<path d="M20 20H7L3 16a2 2 0 0 1 0-3l8-8a2 2 0 0 1 3 0l6 6a2 2 0 0 1 0 3l-6 6"/><path d="M8 8l8 8"/>' },
    { id:'line',   name:'직선',      svg:'<path d="M4 20 20 4"/>' },
    { id:'arrow',  name:'화살표',    svg:'<path d="M4 20 20 4"/><path d="M14 4h6v6"/>' },
    { id:'rect',   name:'사각형',    svg:'<rect x="4" y="5" width="16" height="14" rx="2"/>' },
    { id:'ellipse',name:'원',        svg:'<ellipse cx="12" cy="12" rx="8.5" ry="7.5"/>' },
    { id:'text',   name:'글자',      svg:'<path d="M5 6V4h14v2"/><path d="M12 4v16"/><path d="M9 20h6"/>' }
  ];
  var COLORS = ['#0f172a','#dc2626','#ea580c','#ca8a04','#16a34a','#2563eb','#7c3aed','#db2777'];
  var SIZES = [3, 6, 11, 18];

  var state = {
    tool: 'pen', color: COLORS[0], size: SIZES[1], fill: false,
    shapes: [], redo: [], drawing: null, purpose: 'chat',
    sel: -1,      // 선택된 도형 번호(-1이면 없음)
    drag: null    // 끌어 옮기는 중일 때 { startX, startY, orig }
  };

  var canvas = document.getElementById('board');
  var ctx = canvas.getContext('2d');
  var hint = document.getElementById('hint');
  var textbox = document.getElementById('textbox');
  var dpr = window.devicePixelRatio || 1;

  // ── 화면 구성 ─────────────────────────────────────────────
  var toolsEl = document.getElementById('tools');
  TOOLS.forEach(function (t, i) {
    // 묶음: [선택] | [펜 형광펜 지우개] | [직선 화살표 사각형 원] | [글자]
    if (i === 1 || i === 4 || i === 8) toolsEl.appendChild(Object.assign(document.createElement('span'), { className: 'divider' }));
    var b = document.createElement('button');
    b.className = 'tool' + (t.id === state.tool ? ' on' : '');
    b.title = t.name;
    b.dataset.tool = t.id;
    b.innerHTML = '<svg viewBox="0 0 24 24">' + t.svg + '</svg>';
    b.onclick = function () {
      state.tool = t.id;
      [].forEach.call(toolsEl.querySelectorAll('.tool'), function (x) { x.classList.toggle('on', x.dataset.tool === t.id); });
      canvas.style.cursor = (t.id === 'text') ? 'text' : (t.id === 'select' ? 'default' : 'crosshair');
      if (t.id !== 'select') { state.sel = -1; render(); }
      hideTextbox();
    };
    toolsEl.appendChild(b);
  });

  var colorsEl = document.getElementById('colors');
  COLORS.forEach(function (c) {
    var b = document.createElement('button');
    b.className = 'swatch' + (c === state.color ? ' on' : '');
    b.style.background = c;
    b.title = c;
    b.onclick = function () {
      state.color = c;
      [].forEach.call(colorsEl.children, function (x) { x.classList.remove('on'); });
      b.classList.add('on');
    };
    colorsEl.appendChild(b);
  });

  var sizesEl = document.getElementById('sizes');
  SIZES.forEach(function (s) {
    var b = document.createElement('button');
    b.className = 'size' + (s === state.size ? ' on' : '');
    b.title = s + 'px';
    var d = Math.max(5, Math.round(s * 0.85));
    b.innerHTML = '<i style="width:' + d + 'px;height:' + d + 'px"></i>';
    b.onclick = function () {
      state.size = s;
      [].forEach.call(sizesEl.children, function (x) { x.classList.remove('on'); });
      b.classList.add('on');
    };
    sizesEl.appendChild(b);
  });

  // ── 캔버스 크기 ───────────────────────────────────────────
  function resize() {
    var w = window.innerWidth, h = window.innerHeight;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    render();
  }
  window.addEventListener('resize', resize);

  // ── 그리기 ────────────────────────────────────────────────
  /** perfect-freehand로 만든 부드러운 획(tldraw와 같은 방식) */
  function strokePath(points, size, thinning) {
    // getStroke(번들 미로딩)나 Path2D(구형 환경)가 없으면 null을 돌려 아래 폴백으로 그리게 한다.
    if (!window.getStroke || typeof window.Path2D !== 'function') return null;
    var outline = window.getStroke(points, {
      size: size,
      thinning: thinning,
      smoothing: 0.62,
      streamline: 0.42,
      simulatePressure: true,
      last: true
    });
    if (!outline || !outline.length) return null;
    var p = new Path2D();
    p.moveTo(outline[0][0], outline[0][1]);
    for (var i = 1; i < outline.length; i++) p.lineTo(outline[i][0], outline[i][1]);
    p.closePath();
    return p;
  }

  function drawShape(s) {
    ctx.save();
    if (s.type === 'free' || s.type === 'marker') {
      if (s.type === 'marker') { ctx.globalAlpha = 0.36; ctx.globalCompositeOperation = 'multiply'; }
      var path = strokePath(s.points, s.size * (s.type === 'marker' ? 2.6 : 1), s.type === 'marker' ? 0 : 0.62);
      if (path) { ctx.fillStyle = s.color; ctx.fill(path); }
      else { // getStroke 없을 때의 안전 폴백
        ctx.strokeStyle = s.color; ctx.lineWidth = s.size; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        ctx.beginPath();
        s.points.forEach(function (pt, i) { i ? ctx.lineTo(pt[0], pt[1]) : ctx.moveTo(pt[0], pt[1]); });
        ctx.stroke();
      }
    } else if (s.type === 'text') {
      ctx.fillStyle = s.color;
      ctx.font = '700 ' + (s.size * 2.6 + 8) + 'px Pretendard, "Malgun Gothic", sans-serif';
      ctx.textBaseline = 'top';
      ctx.fillText(s.text, s.x, s.y);
    } else if (s.type === 'image') {
      // 붙여넣은 사진 — 그 위에 표시를 그릴 수 있게 항상 맨 아래에 놓인다
      if (s.img && s.img.complete) ctx.drawImage(s.img, s.x, s.y, s.w, s.h);
    } else {
      ctx.strokeStyle = s.color; ctx.lineWidth = s.size;
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.beginPath();
      if (s.type === 'line' || s.type === 'arrow') {
        ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2); ctx.stroke();
        if (s.type === 'arrow') {
          var a = Math.atan2(s.y2 - s.y1, s.x2 - s.x1);
          var L = Math.max(11, s.size * 3.4);
          ctx.beginPath();
          ctx.moveTo(s.x2, s.y2);
          ctx.lineTo(s.x2 - L * Math.cos(a - Math.PI / 7), s.y2 - L * Math.sin(a - Math.PI / 7));
          ctx.moveTo(s.x2, s.y2);
          ctx.lineTo(s.x2 - L * Math.cos(a + Math.PI / 7), s.y2 - L * Math.sin(a + Math.PI / 7));
          ctx.stroke();
        }
      } else if (s.type === 'rect') {
        var r = Math.min(7, Math.abs(s.x2 - s.x1) / 2, Math.abs(s.y2 - s.y1) / 2);
        if (ctx.roundRect) { ctx.roundRect(Math.min(s.x1, s.x2), Math.min(s.y1, s.y2), Math.abs(s.x2 - s.x1), Math.abs(s.y2 - s.y1), r); }
        else { ctx.rect(Math.min(s.x1, s.x2), Math.min(s.y1, s.y2), Math.abs(s.x2 - s.x1), Math.abs(s.y2 - s.y1)); }
        if (s.fill) { ctx.fillStyle = s.color; ctx.globalAlpha = 0.18; ctx.fill(); ctx.globalAlpha = 1; }
        ctx.stroke();
      } else if (s.type === 'ellipse') {
        ctx.ellipse((s.x1 + s.x2) / 2, (s.y1 + s.y2) / 2, Math.abs(s.x2 - s.x1) / 2, Math.abs(s.y2 - s.y1) / 2, 0, 0, Math.PI * 2);
        if (s.fill) { ctx.fillStyle = s.color; ctx.globalAlpha = 0.18; ctx.fill(); ctx.globalAlpha = 1; }
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  /** 도형을 감싸는 사각 범위 — 선택 표시와 이동에 쓴다 */
  function boundsOf(s) {
    if (s.type === 'free' || s.type === 'marker') {
      var xs = s.points.map(function (p) { return p[0]; }), ys = s.points.map(function (p) { return p[1]; });
      return { x: Math.min.apply(null, xs), y: Math.min.apply(null, ys), w: Math.max.apply(null, xs) - Math.min.apply(null, xs), h: Math.max.apply(null, ys) - Math.min.apply(null, ys) };
    }
    if (s.type === 'text') {
      var fh = s.size * 2.6 + 8;
      return { x: s.x, y: s.y, w: Math.max(24, s.text.length * fh * 0.62), h: fh };
    }
    if (s.type === 'image') return { x: s.x, y: s.y, w: s.w, h: s.h };
    return { x: Math.min(s.x1, s.x2), y: Math.min(s.y1, s.y2), w: Math.abs(s.x2 - s.x1), h: Math.abs(s.y2 - s.y1) };
  }

  /** 도형을 통째로 옮긴다 */
  function moveShape(s, dx, dy) {
    if (s.points) { s.points = s.points.map(function (p) { return [p[0] + dx, p[1] + dy, p[2]]; }); }
    else if (s.type === 'text' || s.type === 'image') { s.x += dx; s.y += dy; }
    else { s.x1 += dx; s.y1 += dy; s.x2 += dx; s.y2 += dy; }
  }

  function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    state.shapes.forEach(drawShape);
    if (state.drawing) drawShape(state.drawing);
    // 선택 표시 — 점선 사각형
    if (state.sel >= 0 && state.shapes[state.sel]) {
      var b = boundsOf(state.shapes[state.sel]);
      ctx.save();
      ctx.strokeStyle = '#2563eb';
      ctx.lineWidth = 1.5;
      ctx.setLineDash([5, 4]);
      ctx.strokeRect(b.x - 6, b.y - 6, b.w + 12, b.h + 12);
      ctx.restore();
    }
    hint.classList.toggle('hide', state.shapes.length > 0 || !!state.drawing);
    document.getElementById('undo').disabled = !state.shapes.length;
    document.getElementById('redo').disabled = !state.redo.length;
  }

  function pos(e) {
    var r = canvas.getBoundingClientRect();
    return [e.clientX - r.left, e.clientY - r.top];
  }

  /** 지우개: 누른 지점과 겹치는 도형을 지운다(획 단위) */
  function eraseAt(x, y) {
    var before = state.shapes.length;
    state.shapes = state.shapes.filter(function (s) { return !hitShape(s, x, y); });
    if (state.shapes.length !== before) { state.redo = []; render(); }
  }
  function hitShape(s, x, y) {
    if (s.type === 'image') {
      return x >= s.x && x <= s.x + s.w && y >= s.y && y <= s.y + s.h;
    }
    var tol = Math.max(10, s.size * 1.6);
    if (s.type === 'free' || s.type === 'marker') {
      return s.points.some(function (p) { return Math.hypot(p[0] - x, p[1] - y) < tol; });
    }
    if (s.type === 'text') {
      var h = s.size * 2.6 + 8;
      return x > s.x - 6 && x < s.x + (s.text.length * h * 0.62) + 6 && y > s.y - 6 && y < s.y + h + 6;
    }
    var minX = Math.min(s.x1, s.x2) - tol, maxX = Math.max(s.x1, s.x2) + tol;
    var minY = Math.min(s.y1, s.y2) - tol, maxY = Math.max(s.y1, s.y2) + tol;
    return x >= minX && x <= maxX && y >= minY && y <= maxY;
  }

  canvas.addEventListener('pointerdown', function (e) {
    if (e.button !== 0) return;
    hideTextbox();
    var p = pos(e);
    canvas.setPointerCapture(e.pointerId);

    if (state.tool === 'select') {
      // 위에 있는 것부터 찾는다(나중에 그린 것이 위)
      state.sel = -1;
      for (var si = state.shapes.length - 1; si >= 0; si--) {
        if (hitShape(state.shapes[si], p[0], p[1])) { state.sel = si; break; }
      }
      if (state.sel >= 0) {
        state.drag = { x: p[0], y: p[1], moved: false };
        canvas.style.cursor = 'grabbing';
      }
      render();
      return;
    }
    state.sel = -1;
    if (state.tool === 'eraser') { state.drawing = { erasing: true }; eraseAt(p[0], p[1]); return; }
    if (state.tool === 'text') { showTextbox(p[0], p[1]); return; }

    if (state.tool === 'pen' || state.tool === 'marker') {
      state.drawing = {
        type: state.tool === 'marker' ? 'marker' : 'free',
        color: state.color, size: state.size,
        points: [[p[0], p[1], e.pressure || 0.5]]
      };
    } else {
      state.drawing = { type: state.tool, color: state.color, size: state.size, fill: state.fill, x1: p[0], y1: p[1], x2: p[0], y2: p[1] };
    }
    render();
  });

  canvas.addEventListener('pointermove', function (e) {
    // 선택 도구로 끌어 옮기는 중
    if (state.drag && state.sel >= 0) {
      var q = pos(e);
      moveShape(state.shapes[state.sel], q[0] - state.drag.x, q[1] - state.drag.y);
      state.drag.x = q[0]; state.drag.y = q[1];
      state.drag.moved = true;
      render();
      return;
    }
    if (!state.drawing) return;
    var p = pos(e);
    if (state.drawing.erasing) { eraseAt(p[0], p[1]); return; }
    if (state.drawing.points) state.drawing.points.push([p[0], p[1], e.pressure || 0.5]);
    else { state.drawing.x2 = p[0]; state.drawing.y2 = p[1]; }
    render();
  });

  function finish() {
    if (state.drag) {
      // 옮기고 나면 되돌리기가 가능해야 하므로 변경으로 취급한다
      if (state.drag.moved) state.redo = [];
      state.drag = null;
      canvas.style.cursor = state.tool === 'select' ? 'default' : 'crosshair';
      render();
      return;
    }
    if (!state.drawing) return;
    var d = state.drawing;
    state.drawing = null;
    if (d.erasing) { render(); return; }
    // 점 하나만 찍힌 도형(실수 클릭)은 버린다
    var tiny = d.points ? d.points.length < 2
      : (Math.abs(d.x2 - d.x1) < 3 && Math.abs(d.y2 - d.y1) < 3);
    if (!tiny) { state.shapes.push(d); state.redo = []; }
    render();
  }
  canvas.addEventListener('pointerup', finish);
  canvas.addEventListener('pointercancel', finish);
  canvas.addEventListener('pointerleave', function () { if (state.drawing && !state.drawing.erasing) finish(); });

  // ── 글자 입력 ─────────────────────────────────────────────
  function showTextbox(x, y) {
    textbox.style.display = 'block';
    textbox.style.left = x + 'px';
    textbox.style.top = y + 'px';
    textbox.style.color = state.color;
    textbox.style.fontSize = (state.size * 2.6 + 8) + 'px';
    textbox.style.fontWeight = '700';
    textbox.value = '';
    textbox.dataset.x = x;
    textbox.dataset.y = y;
    setTimeout(function () { textbox.focus(); }, 0);
  }
  function hideTextbox() {
    if (textbox.style.display === 'none') return;
    var v = textbox.value.trim();
    if (v) {
      state.shapes.push({ type: 'text', text: v, x: +textbox.dataset.x, y: +textbox.dataset.y, color: state.color, size: state.size });
      state.redo = [];
    }
    textbox.style.display = 'none';
    textbox.value = '';
    render();
  }
  textbox.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); hideTextbox(); }
    else if (e.key === 'Escape') { textbox.value = ''; textbox.style.display = 'none'; }
  });
  textbox.addEventListener('blur', hideTextbox);

  // ── 되돌리기/저장 ─────────────────────────────────────────
  function undo() { if (state.shapes.length) { state.redo.push(state.shapes.pop()); render(); } }
  function redo() { if (state.redo.length) { state.shapes.push(state.redo.pop()); render(); } }
  document.getElementById('undo').onclick = undo;
  document.getElementById('redo').onclick = redo;
  document.getElementById('clear').onclick = function () {
    if (!state.shapes.length) return;
    state.redo = state.shapes.slice().reverse().concat(state.redo);
    state.shapes = [];
    state.sel = -1;
    render();
  };
  document.addEventListener('keydown', function (e) {
    if (document.activeElement === textbox) return;
    var mod = e.ctrlKey || e.metaKey;
    if (mod && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); }
    else if (mod && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); }
    else if ((e.key === 'Delete' || e.key === 'Backspace') && state.sel >= 0) {
      e.preventDefault();
      state.shapes.splice(state.sel, 1);
      state.sel = -1;
      state.redo = [];
      render();
    } else if (e.key === 'Escape') {
      if (state.sel >= 0) { state.sel = -1; render(); return; }
      cancel();
    }
  });

  // 채우기 켜기/끄기 — 사각형·원 안쪽을 옅게 칠한다
  var fillBtn = document.getElementById('fill-toggle');
  fillBtn.onclick = function () {
    state.fill = !state.fill;
    fillBtn.textContent = state.fill ? '채움' : '안 채움';
    fillBtn.style.background = state.fill ? '#eff6ff' : '';
    fillBtn.style.color = state.fill ? '#2563eb' : '';
    fillBtn.style.borderColor = state.fill ? '#bfdbfe' : '';
  };

  /* 📋 사진 붙여넣기(Ctrl+V) — 캡처한 화면이나 사진 위에 표시를 그릴 수 있다.
     사진은 항상 맨 아래(먼저 그린 것)로 넣어서, 이미 그려둔 표시가 가려지지 않게 한다. */
  document.addEventListener('paste', function (e) {
    var items = (e.clipboardData && e.clipboardData.items) || [];
    for (var i = 0; i < items.length; i++) {
      if (items[i].type.indexOf('image') !== 0) continue;
      var file = items[i].getAsFile();
      if (!file) continue;
      e.preventDefault();
      var reader = new FileReader();
      reader.onload = function (ev) {
        var img = new Image();
        img.onload = function () {
          // 화면을 넘지 않게 축소해서 가운데 배치
          var maxW = window.innerWidth * 0.8, maxH = window.innerHeight * 0.7;
          var sc = Math.min(1, maxW / img.width, maxH / img.height);
          var w = img.width * sc, h = img.height * sc;
          state.shapes.unshift({
            type: 'image', img: img, size: 1, color: '#000',
            x: (window.innerWidth - w) / 2, y: (window.innerHeight - h) / 2, w: w, h: h
          });
          if (state.sel >= 0) state.sel += 1; // 앞에 끼워 넣었으므로 선택 번호를 밀어준다
          state.redo = [];
          render();
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
      break;
    }
  });

  /** 그린 내용만 잘라서 PNG로 — 빈 여백까지 담기면 공지에 크게 붙어 보기 나쁘다 */
  function exportPng() {
    hideTextbox();
    state.sel = -1;  // 선택 점선이 이미지에 찍히지 않도록
    render();
    if (!state.shapes.length) return null;
    var w = canvas.width, h = canvas.height;
    var tmp = document.createElement('canvas');
    tmp.width = w; tmp.height = h;
    var t = tmp.getContext('2d');
    t.setTransform(dpr, 0, 0, dpr, 0, 0);
    state.shapes.forEach(function (s) {
      var save = ctx; ctx = t; drawShape(s); ctx = save;
    });

    /* ⚠️ 예전에는 캔버스 전체 픽셀을 하나씩 훑어 내용 범위를 찾았다. 4K 화면(DPR 2)에서는
       127MB를 한 번에 할당하고 3,300만 번을 반복해야 해서, 사양이 낮은 PC에서는 저장할 때
       몇 초씩 멈출 수 있었다. 도형 좌표는 이미 갖고 있으므로 그것으로 범위를 계산한다
       (보통 수십 개 — 비교가 안 될 만큼 가볍고 결과도 같다). */
    var found = false;
    var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    state.shapes.forEach(function (s) {
      var b = boundsOf(s);
      if (!b || !isFinite(b.x) || !isFinite(b.y)) return;
      // 선 굵기와 화살표 촉이 잘리지 않도록 도형별 여유를 준다
      var grow = (s.type === 'image') ? 0 : Math.max(4, (s.size || 2) * 2.2);
      found = true;
      if (b.x - grow < minX) minX = b.x - grow;
      if (b.y - grow < minY) minY = b.y - grow;
      if (b.x + b.w + grow > maxX) maxX = b.x + b.w + grow;
      if (b.y + b.h + grow > maxY) maxY = b.y + b.h + grow;
    });
    if (!found) return null;
    // 위 계산은 화면 좌표(CSS 픽셀) 기준이므로 실제 캔버스 픽셀로 환산한다
    minX = Math.round(minX * dpr); minY = Math.round(minY * dpr);
    maxX = Math.round(maxX * dpr); maxY = Math.round(maxY * dpr);
    var pad = Math.round(16 * dpr);
    minX = Math.max(0, minX - pad); minY = Math.max(0, minY - pad);
    maxX = Math.min(w - 1, maxX + pad); maxY = Math.min(h - 1, maxY + pad);
    if (maxX <= minX || maxY <= minY) return null;
    var ow = maxX - minX + 1, oh = maxY - minY + 1;
    var out = document.createElement('canvas');
    out.width = ow; out.height = oh;
    var o = out.getContext('2d');
    o.fillStyle = '#ffffff';           // 흰 배경 — 어두운 테마에서도 글씨가 보이게
    o.fillRect(0, 0, ow, oh);
    o.drawImage(tmp, minX, minY, ow, oh, 0, 0, ow, oh);
    return out.toDataURL('image/png');
  }

  var bridge = window.excalidrawBridge || null;
  function cancel() { if (bridge && bridge.cancel) bridge.cancel(); else window.close(); }
  document.getElementById('cancel').onclick = cancel;
  document.getElementById('save').onclick = function () {
    var url = exportPng();
    if (!url) { alert('먼저 그림을 그려 주세요.'); return; }
    if (bridge && bridge.submitPng) {
      bridge.submitPng({ dataUrl: url, purpose: state.purpose }).then(function (r) {
        if (r && r.ok === false) alert(r.msg || '이미지를 전달하지 못했습니다.');
      }).catch(function (e) { alert('이미지를 전달하지 못했습니다: ' + (e && e.message ? e.message : e)); });
    }
  };

  /* 「사진 편집하기」로 열렸을 때 — 편집할 사진을 맨 아래 레이어로 깔아 준다.
     붙여넣기(Ctrl+V)로 넣을 때와 같은 방식이라, 그 위에 펜·도형·화살표·텍스트로
     표시한 뒤 그대로 「이미지로 보내기」나 PNG 저장을 할 수 있다. */
  function loadBackgroundImage(dataUrl) {
    if (!dataUrl) return;
    var img = new Image();
    img.onload = function () {
      var maxW = window.innerWidth * 0.8, maxH = window.innerHeight * 0.7;
      var sc = Math.min(1, maxW / img.width, maxH / img.height);
      var w = img.width * sc, h = img.height * sc;
      state.shapes.unshift({
        type: 'image', img: img, size: 1, color: '#000',
        x: (window.innerWidth - w) / 2, y: (window.innerHeight - h) / 2, w: w, h: h
      });
      if (state.sel >= 0) state.sel += 1;
      state.redo = [];
      render();
    };
    img.src = dataUrl;
  }

  // 어디에 쓰이는 그림인지(공지/쪽지/채팅) 받아 제목과 목적지를 맞춘다
  if (bridge && bridge.getContext) {
    bridge.getContext().then(function (meta) {
      if (!meta) return;
      state.purpose = meta.purpose || 'chat';
      if (meta.title) document.title = meta.title;
      if (meta.backgroundImage) loadBackgroundImage(meta.backgroundImage);
    }).catch(function () {});
  }

  resize();
})();
</script>
</body>
</html>
