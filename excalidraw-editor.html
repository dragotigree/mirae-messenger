<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' blob:;" />
  <title>그림 그리기 — Mirae Messenger</title>
  <link rel="stylesheet" href="./lib/excalidraw-app.css" />
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #f8fafc; font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
    #app { display: flex; flex-direction: column; height: 100%; }
    .excal-topbar {
      flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 10px 14px; border-bottom: 1px solid #e2e8f0; background: #fff;
    }
    .excal-topbar h1 { margin: 0; font-size: 15px; font-weight: 700; color: #0f172a; }
    .excal-topbar p { margin: 2px 0 0; font-size: 11px; color: #64748b; }
    .excal-actions { display: flex; gap: 8px; align-items: center; }
    .excal-btn {
      border: none; border-radius: 12px; padding: 8px 14px; font-size: 12px; font-weight: 700; cursor: pointer;
    }
    .excal-btn-muted { background: #f1f5f9; color: #475569; }
    .excal-btn-primary { background: #0284c7; color: #fff; }
    .excal-btn:disabled { opacity: 0.55; cursor: wait; }
    #excal-root { flex: 1; min-height: 0; position: relative; }
    #excal-status { font-size: 11px; color: #dc2626; min-height: 14px; margin-right: 6px; }
  </style>
  <script>
    // Excalidraw 폰트·로케일 오프라인 경로 (file:// 기준)
    window.EXCALIDRAW_ASSET_PATH = new URL('./vendor/excalidraw/', window.location.href).href;
  </script>
</head>
<body>
  <div id="app">
    <div class="excal-topbar">
      <div>
        <h1 id="excal-title">✏️ 그림 그리기</h1>
        <p id="excal-subtitle">그린 뒤 「이미지로 보내기」를 누르면 PNG로 첨부됩니다.</p>
      </div>
      <div class="excal-actions">
        <span id="excal-status"></span>
        <button type="button" class="excal-btn excal-btn-muted" id="excal-clear-btn">지우기</button>
        <button type="button" class="excal-btn excal-btn-muted" id="excal-cancel-btn">취소</button>
        <button type="button" class="excal-btn excal-btn-primary" id="excal-send-btn">이미지로 보내기</button>
      </div>
    </div>
    <div id="excal-root"></div>
  </div>
  <script src="./lib/excalidraw-app.js"></script>
  <script>
    (function () {
      const statusEl = document.getElementById('excal-status');
      const sendBtn = document.getElementById('excal-send-btn');
      const clearBtn = document.getElementById('excal-clear-btn');
      const cancelBtn = document.getElementById('excal-cancel-btn');
      const titleEl = document.getElementById('excal-title');
      const subtitleEl = document.getElementById('excal-subtitle');

      let editor = null;
      let purpose = 'chat';
      let busy = false;

      function setStatus(msg) {
        statusEl.textContent = msg || '';
      }

      function blobToDataUrl(blob) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = () => reject(reader.error || new Error('read failed'));
          reader.readAsDataURL(blob);
        });
      }

      async function init() {
        try {
          if (window.excalidrawBridge && typeof window.excalidrawBridge.getContext === 'function') {
            const ctx = await window.excalidrawBridge.getContext();
            purpose = (ctx && ctx.purpose) || 'chat';
            if (ctx && ctx.title) titleEl.textContent = ctx.title;
            if (ctx && ctx.subtitle) subtitleEl.textContent = ctx.subtitle;
          }
        } catch (e) {}

        if (typeof window.mountMiraeExcalidraw !== 'function') {
          setStatus('에디터 로드 실패');
          return;
        }
        editor = window.mountMiraeExcalidraw(document.getElementById('excal-root'), {});
      }

      clearBtn.addEventListener('click', () => {
        if (editor) editor.clear();
        setStatus('');
      });

      cancelBtn.addEventListener('click', async () => {
        if (window.excalidrawBridge) await window.excalidrawBridge.cancel();
        else window.close();
      });

      sendBtn.addEventListener('click', async () => {
        if (busy || !editor) return;
        busy = true;
        sendBtn.disabled = true;
        setStatus('이미지 만드는 중…');
        try {
          const blob = await editor.exportPng();
          const dataUrl = await blobToDataUrl(blob);
          if (window.excalidrawBridge) {
            const res = await window.excalidrawBridge.submitPng({ dataUrl, purpose });
            if (res && res.ok === false) setStatus(res.msg || '전송 실패');
          }
        } catch (err) {
          if (err && err.message === 'EMPTY_SCENE') setStatus('먼저 그림을 그려 주세요.');
          else setStatus('내보내기 실패: ' + (err && err.message ? err.message : err));
        } finally {
          busy = false;
          sendBtn.disabled = false;
        }
      });

      init();
    })();
  </script>
</body>
</html>
