<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>메시지 알림</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: 'Segoe UI', 'Malgun Gothic', sans-serif;
      -webkit-app-region: no-drag;
    }
    .toast {
      --accent: #2196F3;
      --accent-soft: #E3F2FD;
      --accent-dark: #1565C0;
      margin: 8px;
      padding: 16px 16px 13px 16px;
      border-radius: 16px;
      background: #ffffff;
      border: 1px solid #eef1f5;
      border-left: 5px solid var(--accent);
      box-shadow: 0 16px 40px rgba(15, 23, 42, 0.18), 0 2px 8px rgba(15, 23, 42, 0.06);
      display: flex;
      flex-direction: column;
      gap: 11px;
      animation: toast-in 0.26s cubic-bezier(0.22, 1, 0.36, 1);
      max-height: calc(100vh - 16px);
    }
    .toast.is-urgent { --accent: #EF4444; --accent-soft: #FEE2E2; --accent-dark: #B91C1C; }
    .toast-main {
      display: flex;
      gap: 11px;
      align-items: flex-start;
    }
    .icon {
      flex-shrink: 0;
      width: 34px; height: 34px;
      border-radius: 11px;
      display: flex; align-items: center; justify-content: center;
      color: var(--accent-dark);
      background: var(--accent-soft);
      box-shadow: inset 0 0 0 1px rgba(15, 23, 42, 0.04);
    }
    .content { flex: 1; min-width: 0; }
    .title-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .title {
      font-size: 16px; font-weight: 700; color: #0f172a;
      letter-spacing: -0.01em;
      text-transform: none;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .btn-close-x {
      flex-shrink: 0; width: 20px; height: 20px; border: none; background: transparent;
      color: #94a3b8; font-size: 13px; cursor: pointer; border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.12s, color 0.12s;
    }
    .btn-close-x:hover { background: #f1f5f9; color: #475569; }
    .body {
      font-size: 14px; font-weight: 400; line-height: 1.5; color: #334155;
      letter-spacing: -0.01em;
      margin-top: 4px;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden; word-break: break-word;
      text-overflow: ellipsis;
      max-height: calc(1.5em * 2);
    }
    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 6px;
    }
    .btn {
      border: none;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      padding: 8px 15px;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.12s, filter 0.12s, transform 0.08s;
    }
    .btn:active { transform: scale(0.96); }
    .btn-close {
      background: #f1f5f9;
      color: #64748b;
    }
    .btn-close:hover { background: #e2e8f0; }
    .btn-open {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 4px 10px rgba(33, 150, 243, 0.28);
    }
    .toast.is-urgent .btn-open { box-shadow: 0 4px 10px rgba(239, 68, 68, 0.28); }
    .btn-open:hover { filter: brightness(0.94); }
    @keyframes toast-in {
      from { opacity: 0; transform: translateY(14px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
  </style>
</head>
<body>
  <div class="toast" id="toast" role="alert">
    <div class="toast-main">
      <div class="icon" id="icon">
        <svg id="icon-svg" width="17" height="17" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 4h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-5 4v-4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z" fill="currentColor"/>
        </svg>
      </div>
      <div class="content">
        <div class="title-row">
          <div class="title" id="title"></div>
          <button type="button" class="btn-close-x" id="btn-close-x" title="닫기">✕</button>
        </div>
        <div class="body" id="body"></div>
      </div>
    </div>
    <div class="actions">
      <button type="button" class="btn btn-close" id="btn-close">닫기</button>
      <button type="button" class="btn btn-open" id="btn-open">읽기</button>
    </div>
  </div>
  <script>
    function truncateText(text, maxLen) {
      const s = String(text || '').replace(/\s+/g, ' ').trim();
      if (s.length <= maxLen) return s;
      return s.slice(0, Math.max(1, maxLen - 1)) + '…';
    }
    const params = new URLSearchParams(window.location.search);
    const urgent = params.get('urgent') === '1';
    const title = truncateText(params.get('title') || '새 메시지', 48);
    const body = truncateText(params.get('body') || '', 72);
    document.getElementById('title').textContent = title;
    document.getElementById('body').textContent = body;
    document.getElementById('body').title = params.get('body') || '';
    if (urgent) {
      document.getElementById('icon-svg').innerHTML =
        '<path d="M12 3 1 21h22L12 3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>' +
        '<path d="M12 10v5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>' +
        '<circle cx="12" cy="18" r="1.1" fill="currentColor"/>';
    }
    const el = document.getElementById('toast');
    if (urgent) el.classList.add('is-urgent');
    document.getElementById('btn-open').addEventListener('click', (e) => {
      e.stopPropagation();
      if (window.toastApi) window.toastApi.open();
    });
    document.getElementById('btn-close').addEventListener('click', (e) => {
      e.stopPropagation();
      if (window.toastApi) window.toastApi.close();
    });
    document.getElementById('btn-close-x').addEventListener('click', (e) => {
      e.stopPropagation();
      if (window.toastApi) window.toastApi.close();
    });

    // 설정에서 "스페이스바/엔터로 열기"를 켠 경우에만 이 창이 포커스를 받고(main.js에서
    // show() 사용) 이 리스너가 의미가 있다. 꺼져 있으면 이 창은 포커스를 받지 않으므로
    // (showInactive) 아래 keydown은 애초에 발생하지 않는다.
    if (params.get('keyboardOpen') === '1') {
      window.addEventListener('keydown', (e) => {
        if (e.key === ' ' || e.key === 'Spacebar' || e.key === 'Enter') {
          e.preventDefault();
          if (window.toastApi) window.toastApi.open();
        } else if (e.key === 'Escape') {
          e.preventDefault();
          if (window.toastApi) window.toastApi.close();
        }
      });
    }
  </script>
</body>
</html>
