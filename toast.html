<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>메시지 알림</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: 'Segoe UI', 'Malgun Gothic', sans-serif;
      -webkit-app-region: no-drag;
    }
    .toast {
      --accent: #2196F3;
      --accent-soft: #E3F2FD;
      margin: 8px;
      padding: 14px 14px 12px 16px;
      border-radius: 14px;
      background: #ffffff;
      border: 1px solid #e8edf2;
      border-left: 4px solid var(--accent);
      box-shadow: 0 12px 32px rgba(15, 23, 42, 0.14);
      display: flex;
      flex-direction: column;
      gap: 10px;
      animation: toast-in 0.24s ease-out;
      max-height: calc(100vh - 16px);
    }
    .toast.is-urgent { --accent: #EF4444; --accent-soft: #FEE2E2; }
    .toast.is-code-blue { --accent: #2563EB; --accent-soft: #DBEAFE; }
    .toast.is-code-red { --accent: #DC2626; --accent-soft: #FEE2E2; }
    .toast-main {
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }
    .icon {
      flex-shrink: 0;
      width: 30px; height: 30px;
      border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px;
      background: var(--accent-soft);
    }
    .content { flex: 1; min-width: 0; }
    .title-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .title {
      font-size: 13px; font-weight: 800; color: #0f172a;
      letter-spacing: -0.02em;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .btn-close-x {
      flex-shrink: 0; width: 20px; height: 20px; border: none; background: transparent;
      color: #94a3b8; font-size: 13px; cursor: pointer; border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.12s, color 0.12s;
    }
    .btn-close-x:hover { background: #f1f5f9; color: #475569; }
    .body {
      font-size: 12px; line-height: 1.45; color: #64748b;
      margin-top: 3px;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden; word-break: break-word;
      text-overflow: ellipsis;
      max-height: calc(1.45em * 2);
    }
    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 6px;
    }
    .btn {
      border: none;
      border-radius: 9px;
      font-size: 11.5px;
      font-weight: 700;
      padding: 7px 13px;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.12s, filter 0.12s;
    }
    .btn-close {
      background: #f1f5f9;
      color: #64748b;
    }
    .btn-close:hover { background: #e2e8f0; }
    .btn-open {
      background: var(--accent);
      color: #fff;
    }
    .btn-open:hover { filter: brightness(0.92); }
    @keyframes toast-in {
      from { opacity: 0; transform: translateY(10px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
  </style>
</head>
<body>
  <div class="toast" id="toast" role="alert">
    <div class="toast-main">
      <div class="icon" id="icon">💬</div>
      <div class="content">
        <div class="title-row">
          <div class="title" id="title"></div>
          <button type="button" class="btn-close-x" id="btn-close-x" title="닫기">✕</button>
        </div>
        <div class="body" id="body"></div>
      </div>
    </div>
    <div class="actions">
      <button type="button" class="btn btn-close" id="btn-close">닫기</button>
      <button type="button" class="btn btn-open" id="btn-open">읽기</button>
    </div>
  </div>
  <script>
    function truncateText(text, maxLen) {
      const s = String(text || '').replace(/\s+/g, ' ').trim();
      if (s.length <= maxLen) return s;
      return s.slice(0, Math.max(1, maxLen - 1)) + '…';
    }
    const params = new URLSearchParams(window.location.search);
    const urgent = params.get('urgent') === '1';
    const codeType = params.get('codeType') === 'blue' || params.get('codeType') === 'red'
      ? params.get('codeType')
      : '';
    const title = truncateText(params.get('title') || '새 메시지', 48);
    const body = truncateText(params.get('body') || '', 72);
    document.getElementById('title').textContent = title;
    document.getElementById('body').textContent = body;
    document.getElementById('body').title = params.get('body') || '';
    document.getElementById('icon').textContent = codeType === 'blue' ? '💙' : (codeType === 'red' ? '❤️' : (urgent ? '🚨' : '💬'));
    const el = document.getElementById('toast');
    if (urgent) el.classList.add('is-urgent');
    if (codeType === 'blue') el.classList.add('is-code-blue');
    if (codeType === 'red') el.classList.add('is-code-red');
    document.getElementById('btn-open').addEventListener('click', (e) => {
      e.stopPropagation();
      if (window.toastApi) window.toastApi.open();
    });
    document.getElementById('btn-close').addEventListener('click', (e) => {
      e.stopPropagation();
      if (window.toastApi) window.toastApi.close();
    });
    document.getElementById('btn-close-x').addEventListener('click', (e) => {
      e.stopPropagation();
      if (window.toastApi) window.toastApi.close();
    });
  </script>
</body>
</html>
