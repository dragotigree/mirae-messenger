<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>메시지 알림</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: 'Segoe UI', 'Malgun Gothic', sans-serif;
      -webkit-app-region: no-drag;
    }
    .toast {
      margin: 8px;
      padding: 14px 14px 12px;
      border-radius: 14px;
      background: linear-gradient(145deg, #ffffff 0%, #f8fafc 100%);
      border: 1px solid #e2e8f0;
      box-shadow: 0 16px 40px rgba(15, 23, 42, 0.22);
      display: flex;
      flex-direction: column;
      gap: 12px;
      animation: toast-in 0.28s ease-out;
      max-height: calc(100vh - 16px);
    }
    .toast.is-urgent {
      border-color: #fecaca;
      background: linear-gradient(145deg, #fff5f5 0%, #fff 100%);
    }
    .toast-main {
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }
    .icon {
      flex-shrink: 0;
      width: 40px; height: 40px;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      background: linear-gradient(145deg, #0ea5e9, #0284c7);
      box-shadow: 0 4px 12px rgba(14, 165, 233, 0.35);
    }
    .toast.is-urgent .icon {
      background: linear-gradient(145deg, #ef4444, #dc2626);
      box-shadow: 0 4px 12px rgba(220, 38, 38, 0.35);
    }
    .content { flex: 1; min-width: 0; }
    .title {
      font-size: 13px; font-weight: 800; color: #0f172a;
      letter-spacing: -0.02em;
      margin-bottom: 4px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .body {
      font-size: 12px; line-height: 1.45; color: #475569;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
      overflow: hidden; word-break: break-word;
    }
    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
    .btn {
      border: none;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      padding: 8px 14px;
      cursor: pointer;
      font-family: inherit;
    }
    .btn-close {
      background: #f1f5f9;
      color: #475569;
      border: 1px solid #e2e8f0;
    }
    .btn-close:hover { background: #e2e8f0; }
    .btn-open {
      background: #0284c7;
      color: #fff;
    }
    .btn-open:hover { background: #0369a1; }
    .toast.is-urgent .btn-open {
      background: #dc2626;
    }
    .toast.is-urgent .btn-open:hover { background: #b91c1c; }
    @keyframes toast-in {
      from { opacity: 0; transform: translateY(12px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
  </style>
</head>
<body>
  <div class="toast" id="toast" role="alert">
    <div class="toast-main">
      <div class="icon" id="icon">💬</div>
      <div class="content">
        <div class="title" id="title"></div>
        <div class="body" id="body"></div>
      </div>
    </div>
    <div class="actions">
      <button type="button" class="btn btn-close" id="btn-close">닫기</button>
      <button type="button" class="btn btn-open" id="btn-open">열기</button>
    </div>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const urgent = params.get('urgent') === '1';
    const title = params.get('title') || '새 메시지';
    const body = params.get('body') || '';
    document.getElementById('title').textContent = title;
    document.getElementById('body').textContent = body;
    document.getElementById('icon').textContent = urgent ? '🚨' : '💬';
    const el = document.getElementById('toast');
    if (urgent) el.classList.add('is-urgent');
    document.getElementById('btn-open').addEventListener('click', (e) => {
      e.stopPropagation();
      if (window.toastApi) window.toastApi.open();
    });
    document.getElementById('btn-close').addEventListener('click', (e) => {
      e.stopPropagation();
      if (window.toastApi) window.toastApi.close();
    });
  </script>
</body>
</html>
